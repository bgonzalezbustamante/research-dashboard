name: Verify Next.js security patch

on:
  push:
    branches:
      - security/next-16.3.6

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Upgrade Next.js with npm
        run: npm install next@16.3.6 --save-exact

      - name: Show dependency diff
        run: git diff -- package.json package-lock.json

      - name: Commit npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Next.js to 16.3.6"
            git push origin HEAD:security/next-16.3.6
          fi

      - name: Audit dependencies
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
