name: Verify patched dependency set

on:
  push:
    branches:
      - security/next-16.3.6

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit
      - name: Trace audit finding
        run: npm ls js-yaml || true
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
